name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a new push lands on the same branch/PR.
# Saves wasted compute on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Test
        run: python -m pytest tests/ -v

  soak:
    # End-to-end startup smoke: prove the service actually boots, serves a
    # Modbus read, and exits cleanly on SIGTERM. Catches regressions in
    # __main__'s wiring that unit tests can't see (e.g. a lost call to the
    # shutdown coordinator).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write config
        run: |
          mkdir -p /tmp/atspi
          cat > /tmp/atspi/config.yaml <<'EOF'
          modbus_server:
            host: 127.0.0.1
            port: 5502
            unit_id: 1
          io:
            driver: mock
          site:
            unit_id: 23
          persistence:
            state_file: /tmp/atspi/state.json
          EOF

      - name: Start, probe, and stop atspi
        run: |
          set -euxo pipefail
          atspi --config /tmp/atspi/config.yaml > /tmp/atspi/log 2>&1 &
          ATSPI_PID=$!
          trap "kill -TERM $ATSPI_PID 2>/dev/null || true; wait $ATSPI_PID 2>/dev/null || true" EXIT
          # Wait up to 10 s for the listener.
          for _ in $(seq 1 50); do
            if python -c "import socket; s=socket.socket(); s.settimeout(0.3); s.connect(('127.0.0.1', 5502)); s.close()" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          # Confirm a real Modbus read succeeds end-to-end.
          python -m pip install --quiet 'pymodbus>=3.7.4,<3.8'
          python - <<'PY'
          import asyncio
          from pymodbus.client import AsyncModbusTcpClient
          async def main():
              c = AsyncModbusTcpClient(host='127.0.0.1', port=5502)
              await c.connect()
              # ADDR_UNIT_ID = 0x0035 → site.unit_id (23)
              r = await c.read_holding_registers(address=0x0035, count=1, slave=1)
              assert not r.isError(), r
              assert r.registers == [23], r.registers
              c.close()
          asyncio.run(main())
          PY
          # Clean shutdown on SIGTERM, non-zero exit means the wiring is wrong.
          kill -TERM $ATSPI_PID
          wait $ATSPI_PID
          RC=$?
          trap - EXIT
          echo "atspi exit code: $RC"
          test "$RC" = "0"

      - name: Dump service log on failure
        if: failure()
        run: cat /tmp/atspi/log || true

  audit:
    # Vulnerability scan of the project's OWN runtime dependency closure
    # (pymodbus, PyYAML + transitives), derived from pyproject.toml so it can't
    # drift. Deliberately not a whole-environment scan: that pulled in the CI
    # runner's base tooling (pip/setuptools/wheel) and the un-publishable
    # editable `atspi` package, so `--strict` always failed on noise unrelated
    # to what the service actually ships. Kept non-gating (continue-on-error)
    # so a future advisory in a pinned dep can't block an urgent fix from
    # merging — it surfaces as a visible check for a human to action.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit project dependencies
        run: |
          # Pull the exact dependency specifiers from pyproject.toml (no
          # hardcoded duplicate to drift) and audit only that closure.
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print('\n'.join(d['project']['dependencies']))" > /tmp/atspi-reqs.txt
          cat /tmp/atspi-reqs.txt
          pip-audit --strict --desc -r /tmp/atspi-reqs.txt
